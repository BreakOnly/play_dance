    <style id="theme-vars">
/* 玩舞街舞小程序 · 品牌样式（延续原型 BLACKPINK 黑粉潮酷基因） */

:root {
  /* 基础表面 */
  --dance-background: #070708;
  --dance-foreground: #ffffff;
  --dance-card: #1a1a1d;
  --dance-card-foreground: #ffffff;
  --dance-popover: #1a1a1d;
  --dance-popover-foreground: #ffffff;
  --dance-muted: #2e2e33;
  --dance-muted-foreground: #9a9aa2;
  --dance-border: #2e2e33;
  --dance-input: #1a1a1d;
  --dance-surface: #141417;
  --dance-surface-2: #222226;
  --dance-text-tertiary: #6b6b73;

  /* 品牌主色（唯一品牌色相：荧光粉） */
  --dance-primary: #FF2D9B;
  --dance-primary-foreground: #ffffff;
  --dance-secondary: #FF6FB5;
  --dance-primary-soft: rgba(255, 45, 155, 0.16);
  --dance-primary-dark: #b3126b;
  --dance-ring: #FF2D9B;

  /* 语义状态色（仅状态使用） */
  --dance-state-success: #3ecf8e;
  --dance-state-success-soft: rgba(62, 207, 142, 0.14);
  --dance-state-warning: #ffd166;
  --dance-state-warning-bg: rgba(255, 209, 102, 0.1);
  --dance-warning: #ffd166;
  --dance-warning-bg: rgba(255, 209, 102, 0.1);

  /* 圆角（克制层级） */
  --dance-radius-sm: 8px;
  --dance-radius-md: 12px;
  --dance-radius-lg: 16px;
  --dance-radius-xl: 20px;
  --dance-radius-small: 8px;
  --dance-radius-medium: 12px;
  --dance-radius-large: 16px;

  /* 阴影（静态表面以描边分层为主；深阴影仅用于浮动层） */
  --dance-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.2);
  --dance-shadow-2: 0 8px 24px rgba(0, 0, 0, 0.4);
  --dance-shadow-float: 0 8px 24px rgba(0, 0, 0, 0.45);
}

@theme inline {
  --color-background: var(--dance-background);
  --color-foreground: var(--dance-foreground);
  --color-card: var(--dance-card);
  --color-card-foreground: var(--dance-card-foreground);
  --color-popover: var(--dance-popover);
  --color-popover-foreground: var(--dance-popover-foreground);
  --color-primary: var(--dance-primary);
  --color-primary-foreground: var(--dance-primary-foreground);
  --color-secondary: var(--dance-secondary);
  --color-muted: var(--dance-muted);
  --color-muted-foreground: var(--dance-muted-foreground);
  --color-border: var(--dance-border);
  --color-input: var(--dance-input);
  --color-ring: var(--dance-ring);
  --radius-sm: var(--dance-radius-sm);
  --radius-md: var(--dance-radius-md);
  --radius-lg: var(--dance-radius-lg);
  --radius-xl: var(--dance-radius-xl);
}

@layer base {
  body {
    background-color: var(--dance-background);
    color: var(--dance-foreground);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  }
}

    <style>
      /* 玩舞小程序 · 我的会员：关键布局静态样式（document-scroll / body 420px 居中） */
      body { max-width: 420px; margin: 0 auto; }
      .ico-12 { width: 12px; height: 12px; }
      .ico-14 { width: 14px; height: 14px; }
      .ico-18 { width: 18px; height: 18px; }

      /* 渐变头部 */
      .my-header {
        position: relative;
        background: linear-gradient(150deg, var(--dance-primary-dark), #6e0f44 45%, #1a0a12);
        padding: 16px 16px 34px;
        overflow: hidden;
      }
      .my-header::after {
        content: "";
        position: absolute;
        right: -36px;
        top: -36px;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 45, 155, 0.45), transparent 70%);
        pointer-events: none;
      }
      .edit-pill {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: none;
        background: rgba(0, 0, 0, 0.25);
        color: var(--dance-foreground);
        font-size: 13px;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: 999px;
        cursor: pointer;
        transition: background-color 0.15s;
      }
      .edit-pill:hover { background: rgba(0, 0, 0, 0.4); }
      .edit-pill:active { transform: scale(0.97); }
      .edit-pill:focus-visible { outline: 2px solid var(--dance-ring); outline-offset: 2px; }

      /* 资料行 */
      .profile-row { position: relative; z-index: 2; display: flex; align-items: center; gap: 14px; margin-top: 8px; }
      .avatar {
        width: 62px;
        height: 62px;
        flex: none;
        border-radius: 50%;
        border: 2px solid var(--dance-foreground);
        background: var(--dance-primary-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 800;
        color: var(--dance-foreground);
      }
      .profile-info { min-width: 0; }
      .profile-name { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 900; color: var(--dance-foreground); }
      .member-tag {
        flex: none;
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
        padding: 4px 9px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.18);
        color: var(--dance-foreground);
      }
      .profile-phone { display: flex; align-items: center; gap: 5px; margin-top: 5px; font-size: 12px; color: rgba(255, 255, 255, 0.75); }

      /* 顶部资产卡（负 margin 上浮压住头部底部） */
      .asset-wrap { position: relative; z-index: 3; margin: -18px 16px 0; }
      .asset-card {
        position: relative;
        background: var(--dance-card);
        border: 1px solid var(--dance-border);
        border-radius: var(--dance-radius-md);
        padding: 14px 16px 16px;
        box-shadow: var(--dance-shadow-2);
        animation: cardRise 0.32s cubic-bezier(0.3, 0, 0, 1) both;
      }
      .asset-cols { display: flex; align-items: stretch; }
      .asset-col-left { flex: none; width: 132px; }
      .asset-divider { flex: none; width: 1px; background: var(--dance-border); margin: 2px 16px; }
      .asset-col-right { flex: 1; min-width: 0; padding-right: 58px; }
      .asset-label { font-size: 12px; color: var(--dance-muted-foreground); }
      .asset-value { margin-top: 4px; font-size: 26px; font-weight: 900; line-height: 1.15; color: var(--dance-foreground); font-variant-numeric: tabular-nums; }
      .asset-unit { font-size: 12px; font-weight: 400; color: var(--dance-muted-foreground); margin-left: 4px; }
      .asset-date { margin-top: 5px; font-size: 22px; font-weight: 900; line-height: 1.15; color: var(--dance-foreground); font-variant-numeric: tabular-nums; }
      .asset-days { margin-top: 4px; font-size: 11px; color: var(--dance-warning); }
      .recharge-pill {
        position: absolute;
        top: 12px;
        right: 12px;
        border: none;
        background: linear-gradient(90deg, var(--dance-primary), var(--dance-secondary));
        color: var(--dance-primary-foreground);
        font-size: 12px;
        font-weight: 700;
        padding: 6px 14px;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: var(--dance-shadow-float);
        transition: transform 0.15s;
      }
      .recharge-pill:hover { transform: translateY(-1px); }
      .recharge-pill:active { transform: scale(0.96); }
      .recharge-pill:focus-visible { outline: 2px solid var(--dance-ring); outline-offset: 2px; }

      /* 小节标题：粉竖条前缀 */
      .sec-title {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 22px 16px 10px;
        font-size: 15px;
        font-weight: 800;
        color: var(--dance-foreground);
      }
      .sec-title::before {
        content: "";
        width: 4px;
        height: 14px;
        background: var(--dance-primary);
        border-radius: 2px;
      }

      /* 菜单卡 */
      .menu-card {
        margin: 0 16px;
        background: var(--dance-card);
        border: 1px solid var(--dance-border);
        border-radius: var(--dance-radius-md);
        overflow: hidden;
      }
      .menu-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 15px 16px;
        border: none;
        border-bottom: 1px solid var(--dance-border);
        background: none;
        font: inherit;
        color: inherit;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 0.15s;
      }
      .menu-row:last-child { border-bottom: none; }
      .menu-row:hover, .menu-row:active { background: var(--dance-surface-2); }
      .menu-row:focus-visible { outline: 2px solid var(--dance-ring); outline-offset: -2px; }
      .menu-ic { flex: none; width: 24px; display: flex; justify-content: center; color: var(--dance-secondary); }
      .menu-label { flex: 1; min-width: 0; text-align: left; font-size: 14px; color: var(--dance-foreground); }
      .menu-side { flex: none; font-size: 12px; color: var(--dance-muted-foreground); }
      .menu-arrow { flex: none; font-size: 16px; line-height: 1; color: var(--dance-text-tertiary); }

      .page-foot { text-align: center; font-size: 11px; color: var(--dance-text-tertiary); padding: 24px 0 16px; }

      /* 底部 TabBar（文档流末尾，5 槽 + 中央 FAB） */
      .app-tabbar {
        height: 64px;
        background: var(--dance-surface);
        border-top: 1px solid var(--dance-border);
        display: flex;
        align-items: center;
      }
      .app-tab {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        text-decoration: none;
        color: var(--dance-muted-foreground);
        font-size: 11px;
        transition: color 0.15s;
      }
      .app-tab-ico { width: 20px; height: 20px; }
      .app-tab-label { line-height: 1; }
      .app-tab[data-active="true"] { color: var(--dance-secondary); }
      .app-tab:active .app-tab-ico { transform: scale(1.08); }
      .app-tab:focus-visible { outline: 2px solid var(--dance-ring); outline-offset: -4px; border-radius: 8px; }
      .app-tab-fab {
        position: relative;
        top: -18px;
        flex: none;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 4px solid var(--dance-surface);
        background: linear-gradient(90deg, var(--dance-primary), var(--dance-secondary));
        box-shadow: var(--dance-shadow-float);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.15s;
      }
      .app-tab-fab:active { transform: scale(0.92); }
      .app-tab-fab:focus-visible { outline: 2px solid var(--dance-ring); outline-offset: 3px; }
      .app-tab-fab-ico { width: 24px; height: 24px; color: var(--dance-primary-foreground); }

      /* 联系客服底部弹层 */
      .contact-overlay {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: flex-end;
        justify-content: center;
      }
      .contact-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
      .contact-sheet {
        width: 100%;
        max-width: 420px;
        background: var(--dance-card);
        border-radius: 20px 20px 0 0;
        padding: 20px 20px 28px;
        box-shadow: var(--dance-shadow-2);
        animation: sheetUp 0.28s cubic-bezier(0.3, 0, 0, 1);
      }
      .contact-title { text-align: center; font-size: 17px; font-weight: 800; color: var(--dance-foreground); margin: 0 0 10px; }
      .contact-desc { text-align: center; font-size: 13px; line-height: 1.6; color: var(--dance-muted-foreground); margin: 0 0 20px; }
      .contact-ok {
        width: 100%;
        border: none;
        background: linear-gradient(90deg, var(--dance-primary), var(--dance-secondary));
        color: var(--dance-primary-foreground);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 2px;
        padding: 12px;
        border-radius: var(--dance-radius-md);
        box-shadow: var(--dance-shadow-float);
        cursor: pointer;
        transition: transform 0.15s;
      }
      .contact-ok:active { transform: scale(0.98); }
      .contact-ok:focus-visible { outline: 2px solid var(--dance-ring); outline-offset: 2px; }

      /* Toast */
      .page-toast {
        position: fixed;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 70;
        background: rgba(0, 0, 0, 0.85);
        color: var(--dance-foreground);
        font-size: 14px;
        padding: 12px 24px;
        border-radius: 10px;
        display: none;
      }
      .page-toast.show { display: block; animation: fadeIn 0.2s ease; }

      @keyframes cardRise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
    <script>
      (function () {
        var toastEl = document.getElementById('pageToast');
        var toastTimer = null;
        function showToast(msg) {
          toastEl.textContent = msg;
          toastEl.classList.add('show');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
        }

        var overlay = document.getElementById('contactOverlay');
        function openContact() { overlay.classList.add('show'); }
        function closeContact() { overlay.classList.remove('show'); }

        document.getElementById('rechargeBtn').addEventListener('click', openContact);
        document.getElementById('contactOk').addEventListener('click', closeContact);
        overlay.addEventListener('click', function (e) { if (e.target === overlay) closeContact(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeContact(); });

        document.getElementById('editProfile').addEventListener('click', function () { showToast('编辑个人资料'); });
        document.getElementById('noticeRow').addEventListener('click', function () { showToast('查看消息通知'); });
        document.getElementById('settingsRow').addEventListener('click', function () { showToast('设置 / 关于'); });
      })();
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
