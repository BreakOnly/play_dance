    <style id="theme-vars">
/* 玩舞街舞小程序 · 品牌样式（延续原型 BLACKPINK 黑粉潮酷基因） */

:root {
  /* 基础表面 */
  --dance-background: #070708;
  --dance-foreground: #ffffff;
  --dance-card: #1a1a1d;
  --dance-card-foreground: #ffffff;
  --dance-popover: #1a1a1d;
  --dance-popover-foreground: #ffffff;
  --dance-muted: #2e2e33;
  --dance-muted-foreground: #9a9aa2;
  --dance-border: #2e2e33;
  --dance-input: #1a1a1d;
  --dance-surface: #141417;
  --dance-surface-2: #222226;
  --dance-text-tertiary: #6b6b73;

  /* 品牌主色（唯一品牌色相：荧光粉） */
  --dance-primary: #FF2D9B;
  --dance-primary-foreground: #ffffff;
  --dance-secondary: #FF6FB5;
  --dance-primary-soft: rgba(255, 45, 155, 0.16);
  --dance-primary-dark: #b3126b;
  --dance-ring: #FF2D9B;

  /* 语义状态色（仅状态使用） */
  --dance-state-success: #3ecf8e;
  --dance-state-success-soft: rgba(62, 207, 142, 0.14);
  --dance-state-warning: #ffd166;
  --dance-state-warning-bg: rgba(255, 209, 102, 0.1);
  --dance-warning: #ffd166;
  --dance-warning-bg: rgba(255, 209, 102, 0.1);

  /* 圆角（克制层级） */
  --dance-radius-sm: 8px;
  --dance-radius-md: 12px;
  --dance-radius-lg: 16px;
  --dance-radius-xl: 20px;
  --dance-radius-small: 8px;
  --dance-radius-medium: 12px;
  --dance-radius-large: 16px;

  /* 阴影（静态表面以描边分层为主；深阴影仅用于浮动层） */
  --dance-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.2);
  --dance-shadow-2: 0 8px 24px rgba(0, 0, 0, 0.4);
  --dance-shadow-float: 0 8px 24px rgba(0, 0, 0, 0.45);
}

@theme inline {
  --color-background: var(--dance-background);
  --color-foreground: var(--dance-foreground);
  --color-card: var(--dance-card);
  --color-card-foreground: var(--dance-card-foreground);
  --color-popover: var(--dance-popover);
  --color-popover-foreground: var(--dance-popover-foreground);
  --color-primary: var(--dance-primary);
  --color-primary-foreground: var(--dance-primary-foreground);
  --color-secondary: var(--dance-secondary);
  --color-muted: var(--dance-muted);
  --color-muted-foreground: var(--dance-muted-foreground);
  --color-border: var(--dance-border);
  --color-input: var(--dance-input);
  --color-ring: var(--dance-ring);
  --radius-sm: var(--dance-radius-sm);
  --radius-md: var(--dance-radius-md);
  --radius-lg: var(--dance-radius-lg);
  --radius-xl: var(--dance-radius-xl);
}

@layer base {
  body {
    background-color: var(--dance-background);
    color: var(--dance-foreground);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  }
}

    <style id="critical-layout">
      /* ===== 玩舞首页 · 静态关键布局（不依赖 Tailwind 运行时） ===== */
      html { background: var(--dance-background); }
      body { max-width: 420px; margin: 0 auto; }
      .home, .home *, .sheet-mask, .sheet-mask *, .toast { box-sizing: border-box; }
      .home * { margin: 0; padding: 0; }
      button { font: inherit; color: inherit; }
      a { text-decoration: none; }
      ol { list-style: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .ico-16 { width: 16px; height: 16px; }
      .ico-20 { width: 20px; height: 20px; }

      /* 1. 顶部问候栏 */
      .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
      .greet { font-size: 18px; font-weight: 800; color: var(--dance-foreground); }
      .greet em { font-style: normal; color: var(--dance-secondary); }
      .bell { position: relative; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--dance-surface-2); border: 1px solid var(--dance-border); color: var(--dance-foreground); cursor: pointer; transition: border-color .15s, transform .15s; -webkit-tap-highlight-color: transparent; }
      .bell .dot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--dance-primary); }
      .bell:hover { border-color: var(--dance-muted-foreground); }
      .bell:active { transform: scale(.94); }

      /* 焦点可见态（统一品牌粉描边） */
      .bell:focus-visible, .trial:focus-visible, .video-card:focus-visible, .sec-more:focus-visible,
      .app-tab:focus-visible, .app-tab-fab:focus-visible, .sheet-btn:focus-visible {
        outline: 2px solid var(--dance-ring); outline-offset: 2px;
      }

      /* 2. Banner 大图卡 */
      .banner { position: relative; margin: 10px 16px 0; aspect-ratio: 16 / 9; border-radius: var(--dance-radius-lg); overflow: hidden; background: var(--dance-card); border: 1px solid var(--dance-border); }
      .banner img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .banner-tag { position: absolute; left: 12px; bottom: 12px; padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--dance-foreground); background: color-mix(in srgb, var(--dance-background) 55%, transparent); border: 1px solid color-mix(in srgb, var(--dance-border) 90%, transparent); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }

      /* 3. 新人体验课渐变条（10:3） */
      .trial { display: flex; align-items: center; gap: 10px; width: calc(100% - 32px); margin: 14px 16px 0; aspect-ratio: 10 / 3; padding: 0 14px 0 18px; border: none; border-radius: var(--dance-radius-lg); background: linear-gradient(135deg, var(--dance-primary), var(--dance-primary-dark)); cursor: pointer; transition: transform .16s cubic-bezier(.2,.8,.2,1); -webkit-tap-highlight-color: transparent; }
      .trial:active { transform: scale(.98); }
      .trial-txt { flex: 1; min-width: 0; text-align: left; }
      .trial-txt b { display: block; font-size: 18px; font-weight: 900; color: var(--dance-primary-foreground); }
      .trial-txt small { display: block; margin-top: 4px; font-size: 12px; color: color-mix(in srgb, var(--dance-primary-foreground) 84%, transparent); }
      .trial-price { flex: none; text-align: right; font-variant-numeric: tabular-nums; }
      .trial-price b { display: block; font-size: 22px; font-weight: 900; color: var(--dance-primary-foreground); }
      .trial-price small { display: block; margin-top: 2px; font-size: 10px; text-decoration: line-through; color: color-mix(in srgb, var(--dance-primary-foreground) 76%, transparent); }
      .trial-arrow { flex: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--dance-primary-foreground) 16%, transparent); color: var(--dance-primary-foreground); }

      /* 4. 新手指南卡 */
      .guide { width: calc(100% - 32px); margin: 14px 16px 0; padding: 16px; background: var(--dance-card); border: 1px solid var(--dance-border); border-radius: var(--dance-radius-lg); }
      .guide-head { display: flex; align-items: baseline; justify-content: space-between; }
      .guide-title { font-size: 15px; font-weight: 800; color: var(--dance-foreground); }
      .guide-title::before, .sec-title::before { content: ""; display: inline-block; width: 4px; height: 14px; margin-right: 7px; border-radius: 2px; background: var(--dance-primary); vertical-align: -2px; }
      .guide-sub { font-size: 11px; color: var(--dance-muted-foreground); }
      .guide-steps { position: relative; display: flex; margin-top: 18px; }
      .guide-steps::before { content: ""; position: absolute; top: 10px; left: calc(100% / 6); right: calc(100% / 6); height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--dance-primary), var(--dance-secondary)); }
      .step { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
      .step-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: var(--dance-foreground); }
      .step.done .step-dot { background: linear-gradient(135deg, var(--dance-primary), var(--dance-secondary)); }
      .step.todo .step-dot { border: 2px solid var(--dance-muted); background: var(--dance-card); color: var(--dance-muted-foreground); }
      .step-label { margin-top: 8px; padding: 0 4px; font-size: 10px; line-height: 1.35; color: var(--dance-muted-foreground); }
      .step.done .step-label { color: var(--dance-foreground); }

      /* 5. 小节标题行 */
      .sec-head { display: flex; align-items: baseline; margin: 22px 16px 10px; }
      .sec-title { flex: none; font-size: 15px; font-weight: 800; color: var(--dance-foreground); }
      .sec-note { flex: none; margin-left: 10px; font-size: 11px; color: var(--dance-text-tertiary); }
      .sec-more { margin-left: auto; font-size: 12px; color: var(--dance-muted-foreground); transition: color .15s; }
      .sec-more:hover, .sec-more:active { color: var(--dance-secondary); }

      /* 6. 视频横滑列表 */
      .video-list { display: flex; gap: 10px; margin: 0 16px; padding: 2px 2px 8px; overflow-x: auto; scroll-snap-type: x proximity; }
      .video-card { flex: none; width: 140px; overflow: hidden; text-align: left; border: 1px solid var(--dance-border); border-radius: var(--dance-radius-md); background: var(--dance-card); cursor: pointer; scroll-snap-align: start; transition: border-color .15s, transform .15s; -webkit-tap-highlight-color: transparent; }
      .video-card:hover { border-color: var(--dance-primary); }
      .video-card:active { transform: scale(.97); }
      .video-thumb { position: relative; display: flex; align-items: center; justify-content: center; height: 88px; color: var(--dance-primary); background: linear-gradient(135deg, #2a0f1f, var(--dance-card)); }
      .video-play { fill: currentColor; }
      .video-dur { position: absolute; right: 6px; bottom: 6px; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; color: var(--dance-foreground); background: color-mix(in srgb, var(--dance-background) 72%, transparent); font-variant-numeric: tabular-nums; }
      .video-info { display: block; padding: 8px 9px 9px; }
      .video-info b { display: block; font-size: 12px; font-weight: 700; color: var(--dance-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .video-info small { display: block; margin-top: 3px; font-size: 10px; color: var(--dance-muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* 7. 底部 TabBar（canonical 结构专用样式） */
      .app-tabbar { display: flex; align-items: stretch; height: 64px; margin-top: 26px; background: var(--dance-surface); border-top: 1px solid var(--dance-border); border-radius: 0; }
      .app-tab { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--dance-muted-foreground); transition: color .15s; -webkit-tap-highlight-color: transparent; }
      .app-tab-ico { width: 20px; height: 20px; }
      .app-tab-label { font-size: 11px; line-height: 1; }
      .app-tab[data-active="true"] { color: var(--dance-secondary); }
      .app-tab-fab { flex: 1 1 0; align-self: flex-start; margin-top: -20px; display: flex; align-items: flex-start; justify-content: center; background: transparent; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      .app-tab-fab-ico { width: 24px; height: 24px; padding: 16px; border-radius: 50%; background: linear-gradient(90deg, var(--dance-primary), var(--dance-secondary)); border: 4px solid var(--dance-surface); color: var(--dance-primary-foreground); box-shadow: var(--dance-shadow-float); transition: transform .15s cubic-bezier(.2,.8,.2,1); }
      .app-tab-fab:hover .app-tab-fab-ico { transform: translateY(-1px); }
      .app-tab-fab:active .app-tab-fab-ico { transform: scale(.92); }

      /* 8. 页脚 */
      .page-foot { padding: 18px 0 24px; text-align: center; font-size: 11px; color: var(--dance-text-tertiary); }

      /* 联系客服底部弹层 */
      .sheet-mask { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 420px; height: 100%; z-index: 60; display: none; align-items: flex-end; background: color-mix(in srgb, var(--dance-background) 68%, transparent); }
      .sheet-mask.show { display: flex; animation: maskIn .2s ease both; }
      .sheet { width: 100%; padding: 22px 20px 32px; background: var(--dance-card); border: 1px solid var(--dance-border); border-bottom: none; border-radius: var(--dance-radius-lg) var(--dance-radius-lg) 0 0; box-shadow: var(--dance-shadow-2); animation: sheetUp .28s cubic-bezier(.3,0,0,1) both; }
      .sheet h3 { font-size: 17px; font-weight: 800; text-align: center; color: var(--dance-foreground); }
      .sheet p { margin-top: 10px; font-size: 13px; line-height: 1.6; text-align: center; color: var(--dance-muted-foreground); }
      .sheet-btn { display: block; width: 100%; margin-top: 20px; padding: 13px; border: none; border-radius: var(--dance-radius-md); font-size: 15px; font-weight: 800; letter-spacing: 2px; color: var(--dance-primary-foreground); background: linear-gradient(90deg, var(--dance-primary), var(--dance-secondary)); cursor: pointer; transition: transform .15s; }
      .sheet-btn:active { transform: scale(.98); }

      /* Toast */
      .toast { position: fixed; left: 50%; bottom: 108px; transform: translateX(-50%); z-index: 70; display: none; max-width: 80%; padding: 11px 20px; border-radius: var(--dance-radius-md); background: var(--dance-surface-2); border: 1px solid var(--dance-border); box-shadow: var(--dance-shadow-2); color: var(--dance-foreground); font-size: 13px; text-align: center; }
      .toast.show { display: block; animation: maskIn .18s ease both; }

      /* 首屏轻量进场（CSS-first） */
      @keyframes maskIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes sheetUp { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: no-preference) {
        .banner { animation: rise .4s cubic-bezier(.3,0,0,1) both; }
        .trial { animation: rise .4s cubic-bezier(.3,0,0,1) .06s both; }
        .guide { animation: rise .4s cubic-bezier(.3,0,0,1) .12s both; }
        .video-sec { animation: rise .4s cubic-bezier(.3,0,0,1) .18s both; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      }
    </style>
    <script>
      (function () {
        var toast = document.getElementById('toast');
        var toastTimer = null;
        function showToast(msg) {
          toast.textContent = msg;
          toast.classList.add('show');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
        }

        /* 铃铛：暂无新消息 */
        document.getElementById('bellBtn').addEventListener('click', function () {
          showToast('暂无新消息');
        });

        /* 视频卡：播放演示 */
        Array.prototype.forEach.call(document.querySelectorAll('.video-card'), function (card) {
          card.addEventListener('click', function () {
            showToast('视频播放演示');
          });
        });

        /* 体验课条：联系客服底部弹层 */
        var mask = document.getElementById('csMask');
        function openSheet() {
          mask.classList.add('show');
          mask.setAttribute('aria-hidden', 'false');
        }
        function closeSheet() {
          mask.classList.remove('show');
          mask.setAttribute('aria-hidden', 'true');
        }
        document.getElementById('trialBtn').addEventListener('click', openSheet);
        document.getElementById('csOk').addEventListener('click', closeSheet);
        mask.addEventListener('click', function (e) {
          if (e.target === mask) closeSheet();
        });
      })();
    </script>
</body>
</html>
