    <style id="theme-vars">
/* 玩舞街舞小程序 · 品牌样式（延续原型 BLACKPINK 黑粉潮酷基因） */

:root {
  /* 基础表面 */
  --dance-background: #070708;
  --dance-foreground: #ffffff;
  --dance-card: #1a1a1d;
  --dance-card-foreground: #ffffff;
  --dance-popover: #1a1a1d;
  --dance-popover-foreground: #ffffff;
  --dance-muted: #2e2e33;
  --dance-muted-foreground: #9a9aa2;
  --dance-border: #2e2e33;
  --dance-input: #1a1a1d;
  --dance-surface: #141417;
  --dance-surface-2: #222226;
  --dance-text-tertiary: #6b6b73;

  /* 品牌主色（唯一品牌色相：荧光粉） */
  --dance-primary: #FF2D9B;
  --dance-primary-foreground: #ffffff;
  --dance-secondary: #FF6FB5;
  --dance-primary-soft: rgba(255, 45, 155, 0.16);
  --dance-primary-dark: #b3126b;
  --dance-ring: #FF2D9B;

  /* 语义状态色（仅状态使用） */
  --dance-state-success: #3ecf8e;
  --dance-state-success-soft: rgba(62, 207, 142, 0.14);
  --dance-state-warning: #ffd166;
  --dance-state-warning-bg: rgba(255, 209, 102, 0.1);
  --dance-warning: #ffd166;
  --dance-warning-bg: rgba(255, 209, 102, 0.1);

  /* 圆角（克制层级） */
  --dance-radius-sm: 8px;
  --dance-radius-md: 12px;
  --dance-radius-lg: 16px;
  --dance-radius-xl: 20px;
  --dance-radius-small: 8px;
  --dance-radius-medium: 12px;
  --dance-radius-large: 16px;

  /* 阴影（静态表面以描边分层为主；深阴影仅用于浮动层） */
  --dance-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.2);
  --dance-shadow-2: 0 8px 24px rgba(0, 0, 0, 0.4);
  --dance-shadow-float: 0 8px 24px rgba(0, 0, 0, 0.45);
}

@theme inline {
  --color-background: var(--dance-background);
  --color-foreground: var(--dance-foreground);
  --color-card: var(--dance-card);
  --color-card-foreground: var(--dance-card-foreground);
  --color-popover: var(--dance-popover);
  --color-popover-foreground: var(--dance-popover-foreground);
  --color-primary: var(--dance-primary);
  --color-primary-foreground: var(--dance-primary-foreground);
  --color-secondary: var(--dance-secondary);
  --color-muted: var(--dance-muted);
  --color-muted-foreground: var(--dance-muted-foreground);
  --color-border: var(--dance-border);
  --color-input: var(--dance-input);
  --color-ring: var(--dance-ring);
  --radius-sm: var(--dance-radius-sm);
  --radius-md: var(--dance-radius-md);
  --radius-lg: var(--dance-radius-lg);
  --radius-xl: var(--dance-radius-xl);
}

@layer base {
  body {
    background-color: var(--dance-background);
    color: var(--dance-foreground);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  }
}

    </style>
