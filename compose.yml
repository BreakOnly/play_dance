services:
  api:
    build: ./back-end
    restart: unless-stopped
    env_file: .env.production
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
    expose: ['8080']
    logging:
      options: { max-size: 10m, max-file: '5' }
  admin:
    build: ./front-end
    restart: unless-stopped
    depends_on: [api]
    # HTTPS 在服务器网关终止；仅向本机网关开放。
    ports: ['127.0.0.1:8088:80']
    logging:
      options: { max-size: 10m, max-file: '5' }
