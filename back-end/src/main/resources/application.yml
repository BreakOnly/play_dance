server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: dance-studio
  profiles:
    # 未显式指定 profile 时的默认值：local（本机开发直跑即用本地库/密钥）。
    # 生产部署必须显式设置 SPRING_PROFILES_ACTIVE=prod，切勿依赖此默认值。
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/dance_studio?serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USER:dance_app}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: ${DB_BASELINE_EXISTING:false}
    baseline-version: 1
    clean-disabled: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 205MB
mybatis:
  mapper-locations: classpath*:com/dance/studio/mapper/**/*.xml
  type-aliases-package: com.dance.studio.entity
  configuration:
    map-underscore-to-camel-case: true
pagehelper:
  helper-dialect: mysql
  reasonable: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  cors-origins: ${CORS_ORIGINS:}
  admin:
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}
    admin-expire-hours: 12
    user-expire-hours: 168
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_DIR:./uploads}
    base-url: ${STORAGE_BASE_URL:http://localhost:8080/files}
    oss:
      endpoint: ${OSS_ENDPOINT:}
      bucket: ${OSS_BUCKET:}
      access-key-id: ${OSS_AK:}
      access-key-secret: ${OSS_SK:}
      url-expire-seconds: 900
  wechat:
    mock: ${WX_MOCK:false}
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
    code-env: ${WX_CODE_ENV:release}
