version: 2
updates:
  - package-ecosystem: npm
    directory: /front-end
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /mini_program
    schedule: { interval: weekly }
    ignore:
      - dependency-name: '@dcloudio/*'
        update-types: [version-update:semver-major]
  - package-ecosystem: maven
    directory: /back-end
    schedule: { interval: weekly }
